<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.title }} — Nika Fitness CRM</title>
  <meta name="description" content="{{ post.summary }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
</head>
<body class="landing-page">
  <header class="lp-nav">
    <a class="brand" href="{{ url_for('public.index') }}">Nika <span>Fit</span></a>
    <nav class="lp-public-nav">
      <a href="{{ url_for('public.docs') }}">Документация</a>
      <a href="{{ url_for('public.blog') }}">Блог</a>
      <a href="{{ url_for('public.updates') }}">Обновления</a>
    </nav>
  </header>

  <main class="lp-section lp-docs-page">
    <p class="muted">{{ post.published_on }}</p>
    <h1 class="lp-page-title">{{ post.title }}</h1>
    <p class="lp-section-lead">{{ post.summary }}</p>
    <article class="panel lp-markdown-body">
      {{ body_html|safe }}
    </article>
    <p style="margin-top:1rem;">
      <a class="btn secondary" href="{{ url_for('public.blog') }}">Назад в блог</a>
      <a class="btn secondary" href="{{ url_for('public.index') }}#deploy">Варианты развёртывания</a>
    </p>
  </main>

  <footer class="lp-footer">
    <div class="brand">Nika <span>Fit</span></div>
    <p class="muted"><a href="{{ url_for('public.index') }}">На главную</a></p>
  </footer>
</body>
</html>
