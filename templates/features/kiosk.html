<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Киоск</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head><body>
<div class="login-page"><div class="login-card" style="max-width:32rem;">
  <h1>Киоск чекина</h1>
  <p class="muted">{{ device.name }}</p>
  {% if msg %}<div class="flash {{ 'error' if level in ('expired','danger') else ('warning' if level=='expiring' else 'success') }}">{{ msg }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Карта / QR</label>
    <input class="checkin-input card-number" name="card_number" autofocus required placeholder="NF…">
    <button type="submit">Войти</button>
  </form>
</div></div>
</body></html>
