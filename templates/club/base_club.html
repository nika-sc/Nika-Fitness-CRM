<!DOCTYPE html>
<html lang="ru" data-theme="nika-dark" style="--color-primary:{{ theme.accent }};--club-accent:{{ theme.accent }};--club-overlay:{{ theme.overlay / 100 }};--club-surface:{{ theme.surface_rgb }};--color-base-content:{{ theme.text }};--club-text:{{ theme.text }};--club-muted:{{ theme.muted }};{% if theme.background_photo_path %}--club-background:url('{{ url_for('static', filename=theme.background_photo_path) }}');{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ theme.accent }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ club_name }}{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/nf-pwa.svg') }}">
  {% if request.endpoint and request.endpoint.startswith('portal.') %}
  <link rel="manifest" href="{{ url_for('portal.manifest') }}">
  {% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nika.build.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body class="club-theme {% block body_class %}{% endblock %}" data-club-preset="{{ theme.preset }}">
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/nika-ui.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
