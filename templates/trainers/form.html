{% extends "base.html" %}
{% block title %}Тренер{% endblock %}
{% block content %}
<div class="topbar"><h1>{{ 'Редактирование' if trainer else 'Новый тренер' }}</h1></div>
<form class="panel" method="post" enctype="multipart/form-data" style="max-width:720px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>ФИО</label><input name="full_name" required value="{{ trainer.full_name if trainer else '' }}">
  <div class="form-row">
    <div><label>Телефон</label><input name="phone" value="{{ trainer.phone if trainer else '' }}"></div>
    <div><label>Email</label><input name="email" value="{{ trainer.email if trainer else '' }}"></div>
  </div>
  <label>О себе</label><textarea name="bio" rows="4">{{ trainer.bio if trainer else '' }}</textarea>
  <label>Учётная запись</label>
  <select name="user_id">
    <option value="">— без входа в кабинет —</option>
    {% for u in link_candidates %}
    <option value="{{ u.id }}"
      {% if trainer and trainer.user_id == u.id %}selected{% elif u.linked_trainer_id %}disabled{% endif %}>
      {{ u.full_name or u.username }} · {{ u.username }}{% if u.linked_trainer_id and not (trainer and trainer.user_id == u.id) %} (занята){% endif %}
    </option>
    {% endfor %}
  </select>
  <p class="muted small">Сотрудник с ролью «Тренер» получит кабинет «Мои тренировки» со своими окнами и записями.</p>
  {% if trainer %}
  <label><input type="checkbox" name="is_active" {% if trainer.is_active %}checked{% endif %}> Активен</label>
  {% endif %}
  <label>Фото</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp">
  <button style="margin-top:.8rem;" type="submit">Сохранить</button>
</form>
{% endblock %}
